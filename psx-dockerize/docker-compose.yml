# One project: CRM, CRM databases, the follow-up agent, the agent database, and the agent UI.
#   docker compose up -d --build
# Agent service definitions live in psx-ai-control-plane/docker-compose.yml.
include:
  - path: ./psx-ai-control-plane/docker-compose.yml

services:
  laravel:
    build: .
    volumes:
      - ./src:/var/www/html
    expose:
      - "80"
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    depends_on:
      - "database"
      - "mongo"
      - "redis"
