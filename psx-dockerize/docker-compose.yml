  mongo-express:
    image: mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME:
      ME_CONFIG_MONGODB_ADMINPASSWORD:
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017/"
    depends_on:
      - "mongo"
  redis:
    image: redis
  websocket:
    build: ./websocket
    environment:
      REDIS_DB: 0
      REDIS_FAMILY: 4
      REDIS_HOST: redis
      REDIS_PASSWORD: 
      REDIS_PORT: 6379
  minio:
    image: minio/minio
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:
      MINIO_ROOT_PASSWORD:

    
volumes:
  psx_data:
  psx_mongo_data:
  minio_data:
