#      MYSQL_PASSWORD:
#      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
#    command: sh -c "apk update && apk add openssh-client && while true; do ssh -i /home/usafhassan/.ssh/_stil -nNT -L *:3306:balder-1.cfayxmxwecjj.us-west-2.rds.amazonaws.com:3306 ubuntu@ec2-35-166-165-115.us-west-2.compute.amazonaws.com; done"
#    volumes:
