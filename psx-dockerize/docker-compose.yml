#    expose:
#      - 3306
#
  mongo-express:
    image: mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME:
      ME_CONFIG_MONGODB_ADMINPASSWORD:
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017/"
    depends_on:
      - "mongo"
  redis:
    image: redis
    restart: unless-stopped
  websocket:
    build: ./websocket
    environment:
      REDIS_DB: 0
      REDIS_FAMILY: 4
      REDIS_HOST: redis
      REDIS_PASSWORD: 
      REDIS_PORT: 6379
  minio:
    # Docker Hub minio/minio was removed. Build from the binary in minio.deb.
    build:
      context: ./minio-local
    image: psx-minio:local
    pull_policy: never
    restart: unless-stopped
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:
      MINIO_ROOT_PASSWORD:

  # Local Twilio browser phone. UI: http://localhost:3001 (mapped in override).
  # Use TWILIO_DEV_PHONE_NUMBER spare only — never the Website virtnum.
  twilio-dev-phone:
    build: ./dev-phone
    restart: unless-stopped
    environment:
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_DEV_PHONE_NUMBER: ${TWILIO_DEV_PHONE_NUMBER:-}

volumes:
  psx_data:
  psx_mongo_data:
  minio_data:
