version: '3.7'
services:
  laravel:
    build: .
    volumes:
      - ./src:/var/www/html
    expose:
      - "80"
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    depends_on:
      - "database"
      - "mongo"
      - "redis"
  laravel7:
    build: .
    volumes:
      - ./src:/var/www/html
    expose:
      - "80"
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    depends_on:
      - "database"
      - "mongo"
      - "redis"
  laravel8:
    build:
      dockerfile: Dockerfile8
    volumes:
      - ../../psxascend:/var/www/html
    expose:
      - "80"
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    depends_on:
      - "database"
      - "mongo"
      - "redis"
  laravel9:
    build:
      dockerfile: Dockerfile9
    volumes:
      - ../../psxascend:/var/www/html
    expose:
      - "80"
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    depends_on:
      - "database"
      - "mongo"
      - "redis"
  laravel12:
    build:
      dockerfile: Dockerfile12
    volumes:
      - ../../psxascend:/var/www/html
    expose:
      - "80"
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
        - VITE_HOST=0.0.0.0
    depends_on:
      - "database"
      - "mongo"
      - "redis"
# LOCAL
  database:
    image: mariadb:10.2
    container_name: psx-database
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE:
      MYSQL_USER:
      MYSQL_PASSWORD:
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - psx_data:/var/lib/mysql
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
  mongo:
    image: mongo
    environment:
      MONGO_INITDB_DATABASE: psx_data
    volumes:
        - psx_mongo_data:/data/db
